name: Testes e segurança
on: [push, pull_request]

# O workflow só pode ler o código (privilégio mínimo)
permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes (inclui testes de segurança)
        run: pytest -q
      - name: Dependências com falhas conhecidas
        run: pip-audit -r requirements.txt

  usuarios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicos/usuarios
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes do serviço de Usuários
        run: python -m pytest -q
      - name: Dependências do serviço de Usuários
        run: pip-audit -r requirements.txt
      - name: Build independente
        run: docker build -t helpdesk-usuarios:ci .

  inventario:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicos/inventario
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes do serviço de Inventário
        run: python -m pytest -q
      - name: Dependências do serviço de Inventário
        run: pip-audit -r requirements.txt
      - name: Build independente
        run: docker build -t helpdesk-inventario:ci .

  chamados:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicos/chamados
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes do serviço de Chamados
        run: python -m pytest -q
      - name: Dependências do serviço de Chamados
        run: pip-audit -r requirements.txt
      - name: Build independente
        run: docker build -t helpdesk-chamados:ci .

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testes do gateway
        run: python -m pytest -q
      - name: Escape de conteúdo na interface
        run: node --test tests/xss.test.cjs
      - name: Dependências do gateway
        run: pip-audit -r requirements.txt
      - name: Build independente
        run: docker build -t helpdesk-gateway:ci .

  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r integracao/requirements.txt
      - name: Segurança e indisponibilidade com Docker Compose
        run: python -m pytest -q -c integracao/pytest.ini integracao/tests
