services:
  gateway:
    build: ./gateway
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DOCS: ${DOCS:-1}
      USUARIOS_URL: http://usuarios-proxy:8000
      INVENTARIO_URL: http://inventario:8000
      CHAMADOS_URL: http://chamados:8000
      GATEWAY_TIMEOUT_SEGUNDOS: ${GATEWAY_TIMEOUT_SEGUNDOS:-8}
    networks:
      default:
      identidade:
        ipv4_address: ${GATEWAY_IP_INTERNO:-172.31.46.2}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  usuarios:
    build: ./servicos/usuarios
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: sqlite:////dados/usuarios.db
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
      FORWARDED_ALLOW_IPS: ${GATEWAY_IP_INTERNO:-172.31.46.2}
    networks:
      default:
      identidade:
        aliases:
          - usuarios-proxy
    volumes:
      - dados_usuarios:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  inventario:
    build: ./servicos/inventario
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: sqlite:////dados/inventario.db
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
      USUARIOS_URL: http://usuarios:8000
      USUARIOS_TIMEOUT_SEGUNDOS: ${USUARIOS_TIMEOUT_SEGUNDOS:-3}
    volumes:
      - dados_inventario:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  chamados:
    build: ./servicos/chamados
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: sqlite:////dados/chamados.db
      DADOS_EXEMPLO: ${DADOS_EXEMPLO:-1}
      USUARIOS_URL: http://usuarios:8000
      INVENTARIO_URL: http://inventario:8000
      USUARIOS_TIMEOUT_SEGUNDOS: ${USUARIOS_TIMEOUT_SEGUNDOS:-3}
      INVENTARIO_TIMEOUT_SEGUNDOS: ${INVENTARIO_TIMEOUT_SEGUNDOS:-3}
    volumes:
      - dados_chamados:/dados
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dados_usuarios:
  dados_inventario:
  dados_chamados:

networks:
  identidade:
    internal: true
    ipam:
      config:
        - subnet: ${GATEWAY_SUBREDE_INTERNA:-172.31.46.0/28}
          ip_range: ${GATEWAY_FAIXA_INTERNA:-172.31.46.8/29}
